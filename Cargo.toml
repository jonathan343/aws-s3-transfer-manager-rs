[workspace]
resolver = "2"
members = [
    "aws-sdk-s3-transfer-manager",

    # internal
    "s3-mock-server",
    "benches",
    "integration-tests"
]
# The Python bindings are a standalone cdylib built with maturin; keeping them out of the
# workspace keeps workspace-wide jobs (sanitizers, feature powerset, etc.) free of PyO3.
exclude = ["bindings/python"]
