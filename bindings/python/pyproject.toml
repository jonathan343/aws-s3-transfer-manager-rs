[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "aws-s3-transfer-manager"
description = "High-throughput Amazon S3 uploads and downloads, powered by the AWS S3 Transfer Manager for Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Amazon Web Services" }]
keywords = ["aws", "s3", "amazon-s3", "transfer-manager", "upload", "download"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/awslabs/aws-s3-transfer-manager-rs"
Issues = "https://github.com/awslabs/aws-s3-transfer-manager-rs/issues"
Changelog = "https://github.com/awslabs/aws-s3-transfer-manager-rs/blob/main/bindings/python/CHANGELOG.md"

[dependency-groups]
test = [
    # moto needs awscrt to compute CRC64NVME checksums (it silently falls back to CRC32).
    "awscrt>=0.28",
    "boto3>=1.40",
    "moto[server]>=5.1",
    "pytest>=9.0",
    "pytest-asyncio>=1.2",
    "pytest-timeout>=2.4",
]
lint = [
    "mypy>=1.18",
    "ruff>=0.14",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.maturin]
python-source = "python"
module-name = "aws_s3_transfer_manager._core"
include = [{ path = "LICENSE", format = "sdist" }, { path = "NOTICE", format = "sdist" }]

[tool.uv]
# Rebuild the extension whenever its Rust sources (or the transfer manager's) change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "../../aws-sdk-s3-transfer-manager/Cargo.toml" },
    { file = "../../aws-sdk-s3-transfer-manager/src/**/*.rs" },
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
# strict config, markers, xfail and parametrization ids.
strict = true
filterwarnings = ["error"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = "120"  # pytest-timeout still declares this option as a string

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ASYNC",
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",
    "F",
    "FA",   # flake8-future-annotations
    "I",    # isort
    "N",    # pep8-naming
    "PGH",
    "PIE",
    "PT",   # flake8-pytest-style
    "PYI",  # flake8-pyi
    "RET",
    "RUF",
    "SIM",
    "TC",   # flake8-type-checking
    "UP",   # pyupgrade
    "W",
]
ignore = [
    "D105", # magic methods document themselves
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.per-file-ignores]
# The stub carries docstrings on purpose: it is where IDEs read documentation for the native
# module from. `filter=` matches the standard library's use of the name (e.g. `tarfile`).
"*.pyi" = ["PYI021", "A002"]
"tests/**" = ["ANN", "D"]
"examples/**" = ["D"]

[tool.ruff.lint.flake8-type-checking]
# TypedDict annotations are resolved at runtime by `typing.get_type_hints`.
runtime-evaluated-base-classes = ["typing.TypedDict"]

[tool.ruff.lint.isort]
known-first-party = ["aws_s3_transfer_manager"]
known-local-folder = ["helpers"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["python", "tests", "examples"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["moto.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
