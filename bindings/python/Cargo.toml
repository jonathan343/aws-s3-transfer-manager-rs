[package]
name = "aws-s3-transfer-manager-py"
version = "0.1.0"
edition = "2021"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
license = "Apache-2.0"
rust-version = "1.91.1"
repository = "https://github.com/awslabs/aws-s3-transfer-manager-rs"
description = "Python bindings for the Amazon S3 Transfer Manager"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
aws-sdk-s3-transfer-manager = { path = "../../aws-sdk-s3-transfer-manager" }
aws-config = { version = "1.8.15", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-runtime = "1.7.2"
aws-sdk-s3 = { version = "1.128.0", features = ["behavior-version-latest"] }
aws-smithy-types = "1.4.7"
bytes = "1.9"
futures-util = "0.3.31"
log = "0.4"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = "0.29"
pyo3-log = "0.13"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7.13", features = ["rt"] }
# `log` makes `tracing` events (the transfer manager's and the SDK's) visible to `pyo3-log`,
# and therefore to Python's `logging` module.
tracing = { version = "0.1", features = ["log"] }

# Published wheels are built with `--profile dist`; plain release builds (e.g. `uv sync`) stay
# quick to compile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
